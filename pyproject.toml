[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contextual-bandit-decision-ops"
version = "0.2.0"
description = "Real-time offer recommendations with contextual Bayesian Thompson Sampling."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi",
    "httpx",
    "numpy",
    "pandas",
    "uvicorn",
]

[project.urls]
Repository = "https://github.com/Vishai/contextual-bandit-decision-ops"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[project.scripts]
contextual-bandit-generate = "contextual_bandit_decision_ops.cli:main"
contextual-bandit-compare = "contextual_bandit_decision_ops.comparison_cli:main"
contextual-bandit-learn = "contextual_bandit_decision_ops.learning_cli:main"
contextual-bandit-ope = "contextual_bandit_decision_ops.off_policy_cli:main"
contextual-bandit-gate = "contextual_bandit_decision_ops.promotion_cli:main"
contextual-bandit-service = "contextual_bandit_decision_ops.service_cli:main"
contextual-bandit-observe = "contextual_bandit_decision_ops.observability_cli:main"
contextual-bandit-info = "contextual_bandit_decision_ops.metadata_cli:main"
contextual-bandit-features = "contextual_bandit_decision_ops.feature_pipeline_cli:main"
contextual-bandit-offers = "contextual_bandit_decision_ops.offer_comparison_cli:main"
contextual-bandit-backtest = "contextual_bandit_decision_ops.backtest_cli:main"
contextual-bandit-scenarios = "contextual_bandit_decision_ops.scenario_cli:main"
contextual-bandit-offer-service = "contextual_bandit_decision_ops.offer_service_cli:main"
contextual-bandit-latency = "contextual_bandit_decision_ops.latency_benchmark:main"
contextual-bandit-retrain = "contextual_bandit_decision_ops.retrain_cli:main"
contextual-bandit-monitor = "contextual_bandit_decision_ops.monitoring_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
